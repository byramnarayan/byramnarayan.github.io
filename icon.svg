<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#08090d"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <!-- Radial fade mask for grid -->
    <radialGradient id="gridMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="512" height="512" rx="96" fill="url(#gridMask)"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#grid)" mask="url(#gridFade)"/>

  <!-- Accent glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#8a86ff" stroke-width="1" opacity="0.25"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#8a86ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Inner background circle -->
  <circle cx="256" cy="256" r="148" fill="#0d0f15"/>

  <!-- "RM" monogram text -->
  <!-- R -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="600"
    font-size="148"
    letter-spacing="-8"
    fill="#fafafa">RM</text>

  <!-- Accent underline bar -->
  <rect x="182" y="322" width="148" height="3" rx="2" fill="#8a86ff"/>

  <!-- Mono label -->
  <text
    x="256"
    y="360"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-weight="500"
    font-size="18"
    letter-spacing="8"
    fill="#8d93a3">PORT</text>
</svg>
