<!DOCTYPE html>

  <head>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="../css/modern_normalize.css">

    <meta name="theme-color" content="#08090d">

    <link rel="apple-touch-icon" href="/icon.png">

    <script>
      (function(){
        var t=localStorage.getItem('portfolio-theme');
        if(!t) t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
        document.documentElement.classList.add('theme-'+t);
      })();
    </script>

  <body>
    <div id="scroll-progress" aria-hidden="true"></div>

    <header class="site-header" role="banner">
      <div class="frame">
        <a href="../index.html" class="site-logo" aria-label="Back to Portfolio">RM·FOLIO</a>
        <nav aria-label="Main navigation">
          <ul class="site-nav">
            <li><a href="../index.html">Portfolio</a></li>
            <li><a href="../resume.html">Résumé</a></li>
            <li><a href="index.html" aria-current="page" style="color:var(--accent);">Blog</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <button id="theme-toggle" aria-label="Toggle theme">DARK</button>

      <div class="frame" style="position:relative;z-index:1;text-align:center;">
        <div class="rise rise-1" style="margin-bottom:1.5rem;">
          <span class="eyebrow">Blog</span>
        </div>

        </p>
        <div class="rise rise-4" style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;">
          <a href="../index.html" class="btn btn-primary">← Back to Portfolio</a>
          <a href="mailto:byramnarayan@gmail.com" class="btn btn-ghost">Get Notified</a>

        <ul class="footer-links">
          <li><a href="../index.html">Portfolio</a></li>

    <script src="../js/app.js" defer></script>
    <style>
      .observe-rise { opacity: 0; transform: translateY(12px); transition: opacity .55s ease, transform .55s ease; }
      .observe-rise.risen { opacity: 1; transform: none; }
    </style>
