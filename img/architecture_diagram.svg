<svg width="100%" height="100%" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <!-- Neon Glow Filter for Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#28044a"/>
    </linearGradient>
    
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4facfe" />
    </marker>
  </defs>
  
  <!-- Base styling -->
  <g font-family="Inter, Helvetica Neue, sans-serif" font-weight="500">
    
    <!-- Background Box representing Cloud Boundary -->
    <rect x="50" y="50" width="1100" height="600" rx="20" fill="transparent" stroke="#334155" stroke-dasharray="10 10" stroke-width="2" />
    <text x="70" y="90" font-size="22" fill="#94a3b8" font-weight="600">Google Cloud Platform &amp; Multi-Agent System (MindX AI)</text>
    
    <!-- Connector Lines -->
    <path d="M 225 350 L 375 350" fill="none" stroke="#4facfe" stroke-width="3" filter="url(#glow)" marker-end="url(#arrow)" />
    
    <path d="M 575 350 L 725 350" fill="none" stroke="#4facfe" stroke-width="3" filter="url(#glow)" marker-end="url(#arrow)" />
    
    <!-- Split lines from agents to Neo4j and Models -->
    <path d="M 925 310 Q 1050 310 1050 240" fill="none" stroke="#4facfe" stroke-width="3" filter="url(#glow)" marker-end="url(#arrow)" />
    <path d="M 925 390 Q 1050 390 1050 460" fill="none" stroke="#4facfe" stroke-width="3" filter="url(#glow)" marker-end="url(#arrow)" />

    <!-- Node 1: Client / Patient -->
    <rect x="100" y="275" width="250" height="150" rx="16" fill="url(#boxGrad1)" stroke="#475569" stroke-width="2" filter="url(#shadow)" />
    <text x="225" y="325" font-size="20" fill="#f8fafc" text-anchor="middle">Client Application</text>
    <text x="225" y="355" font-size="14" fill="#cbd5e1" text-anchor="middle">Mobile/Web Interface</text>
    <text x="225" y="375" font-size="12" fill="#94a3b8" text-anchor="middle">(React/Flutter)</text>
    
    <!-- Node 2: Firebase Backend -->
    <rect x="425" y="275" width="250" height="150" rx="16" fill="url(#boxGrad3)" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <text x="550" y="325" font-size="20" fill="#f8fafc" text-anchor="middle">Firebase Backend</text>
    <text x="550" y="355" font-size="14" fill="#cbd5e1" text-anchor="middle">HIPAA Compliant</text>
    <text x="550" y="375" font-size="12" fill="#94a3b8" text-anchor="middle">Data Anonymization</text>

    <!-- Node 3: Multi-Agent System -->
    <rect x="750" y="235" width="250" height="230" rx="16" fill="url(#boxGrad2)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" />
    <text x="875" y="280" font-size="20" fill="#f8fafc" text-anchor="middle">Multi-Agent System</text>
    <text x="875" y="310" font-size="14" fill="#cbd5e1" text-anchor="middle">LangChain / LangGraph</text>
    
    <rect x="775" y="330" width="200" height="35" rx="8" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1" />
    <text x="875" y="352" font-size="13" fill="#e2e8f0" text-anchor="middle">Risk Assessment Agent</text>
    
    <rect x="775" y="375" width="200" height="35" rx="8" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1" />
    <text x="875" y="397" font-size="13" fill="#e2e8f0" text-anchor="middle">Cultural Support Agent</text>
    
    <rect x="775" y="420" width="200" height="35" rx="8" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1" />
    <text x="875" y="442" font-size="13" fill="#e2e8f0" text-anchor="middle">Analytics Agent</text>

    <!-- Node 4: Neo4j Graph -->
    <rect x="1000" y="150" width="150" height="90" rx="12" fill="url(#boxGrad1)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
    <text x="1075" y="195" font-size="16" fill="#f8fafc" text-anchor="middle">Neo4j</text>
    <text x="1075" y="215" font-size="12" fill="#94a3b8" text-anchor="middle">Knowledge Graph</text>

    <!-- Node 5: Cloud Run LLM -->
    <rect x="1000" y="460" width="150" height="90" rx="12" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
    <text x="1075" y="505" font-size="16" fill="#f8fafc" text-anchor="middle">Cloud Run</text>
    <text x="1075" y="525" font-size="12" fill="#94a3b8" text-anchor="middle">LLM API Hosting</text>
    
    <!-- Floating Data Labels over Lines (White Background Trick) -->
    <g transform="translate(300, 325)">
        <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#1e293b" />
        <text x="0" y="4" font-size="12" fill="#e2e8f0" text-anchor="middle">Encrypted</text>
    </g>

    <g transform="translate(650, 325)">
        <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#1e293b" />
        <text x="0" y="4" font-size="12" fill="#e2e8f0" text-anchor="middle">Auth &amp; DB</text>
    </g>

  </g>
</svg>
